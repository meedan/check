name: Build and Run Check Tests

on:
  push:
    branches:
    - master
    - develop

  pull_request:
    branches:
    - develop

permissions:
  id-token: write
  contents: read

jobs:
  check-script:
    runs-on:
        labels: check
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE_TO_ASSUME }}
        aws-region: eu-west-1

    # Clean up disk space before starting
    - name: Free up disk space
      run: |
        echo "Available disk space before cleanup:"
        df -h

        # Remove unnecessary packages and files
        sudo apt-get autoremove -y
        sudo apt-get autoclean -y
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

        # Clean Docker system
        docker system prune -af --volumes || true

        echo "Available disk space after cleanup:"
        df -h

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        # Enable garbage collection and use smaller build cache
        buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage 1000mb

    - name: Before script
      env:
        GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
        GITHUB_JOB_NAME: ${{ github.job }}
      run: |
        sed -i 's/git@github.com:/https:\/\/github.com\//' .gitmodules
        git submodule update --init --recursive
        sed -i '/git submodule/d' bin/first-build.sh
        # Replace abort-on-container-exit with detached mode AND no restart policy
        sed -i 's/--abort-on-container-exit/-d --restart=no/' bin/first-build.sh

    # Monitor disk usage during build
    - name: Monitor disk space
      run: |
        echo "Disk space before build:"
        df -h
        echo "Docker images before build:"
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

    - name: Run Script
      env:
        GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
        GITHUB_JOB_NAME: ${{ github.job }}
      run: |
        # Run the build script
        ./bin/first-build.sh

        # Wait for Docker Compose to settle
        sleep 10

        # Check for any containers in restart loop and kill them
        echo "Checking for containers in restart loop..."
        docker ps --format '{{.ID}} {{.Status}}' | grep "Restarting" | awk '{print $1}' | xargs -r docker kill || true

        # Clean up intermediate images after build
        echo "Cleaning up intermediate Docker artifacts..."
        docker image prune -f

        # Wait for services with timeout
        echo "Waiting for services to be ready..."
        timeout=300  # 5 minutes timeout
        elapsed=0
        until curl --silent -I -f --fail http://localhost:3333 || [ $elapsed -gt $timeout ]; do
            printf "."
            sleep 1
            ((elapsed++))
        done

        if [ $elapsed -gt $timeout ]; then
            echo "Timeout waiting for services to start"
            docker ps -a
            docker logs $(docker ps -q) || true
            exit 1
        fi

        sleep 240

        # Health checks with better error reporting
        echo "Running health checks..."
        services=("3200" "3100" "8000/ping" "3333" "3000")
        for service in "${services[@]}"; do
            if [[ "$service" == *"/ping" ]]; then
                url="http://localhost:$service"
            else
                url="http://localhost:$service"
            fi

            if (( $(curl -s -o /dev/null -w "%{http_code}" "$url") != 200 )); then
                echo "Health check failed for $url"
                docker ps -a
                exit 1
            fi
        done

        # Generate output for comparison
        docker ps --format '{{.Image}}' | sort >> docker_up_output.txt
        diff <(grep -v 'moby/buildkit:buildx-stable-1' docker_up_output.txt) test/image_names.txt

    # Monitor final disk usage
    - name: Final disk usage check
      if: always()
      run: |
        echo "Final disk space usage:"
        df -h
        echo "Docker images after tests:"
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

    - name: Comprehensive Docker Cleanup
      if: always()
      run: |
        echo "Running comprehensive cleanup..."

        # First, try to kill containers that are restarting or stuck
        echo "Killing any stuck or restarting containers..."
        docker ps -a --format '{{.ID}} {{.Status}}' | grep -E "(Restarting|Up.*restart)" | awk '{print $1}' | xargs -r docker kill || true

        # Wait a moment for containers to die
        sleep 2

        # Force stop all running containers with timeout
        echo "Force stopping all containers..."
        if [ "$(docker ps -q)" ]; then
            timeout 30 docker stop $(docker ps -q) || docker kill $(docker ps -q) || true
        fi

        # Remove all containers (running and stopped)
        echo "Removing all containers..."
        if [ "$(docker ps -aq)" ]; then
            docker rm -f $(docker ps -aq) || true
        fi

        # Remove all images (including intermediate layers)
        echo "Removing all images..."
        if [ "$(docker images -aq)" ]; then
            docker rmi -f $(docker images -aq) || true
        fi

        # Remove all volumes
        echo "Removing all volumes..."
        if [ "$(docker volume ls -q)" ]; then
            docker volume rm -f $(docker volume ls -q) || true
        fi

        # Remove all networks (except default ones)
        echo "Removing custom networks..."
        docker network ls --filter type=custom -q | xargs -r docker network rm || true

        # Clean build cache and system
        echo "Cleaning build cache and system..."
        docker builder prune -af || true
        docker system prune -af --volumes || true

        # If Docker daemon is having issues, restart it (for self-hosted runners)
        if command -v systemctl &> /dev/null; then
            echo "Attempting to restart Docker daemon..."
            sudo systemctl restart docker || true
            sleep 5
            docker system prune -af --volumes || true
        fi

        # Final disk space check
        echo "Disk space after complete cleanup:"
        df -h

        echo "Remaining Docker resources:"
        docker ps -a || true
        docker images || true
        docker volume ls || true
        export FALLBACK_BRANCH=$([ "$GITHUB_BRANCH" == "master" ] && echo "main" && echo "master" || echo "develop")
        git submodule foreach 'bash -c "git checkout master ; git checkout develop ; git checkout $FALLBACK_BRANCH ; git checkout $GITHUB_BRANCH ; exit 0"'
        git submodule foreach git rev-parse --abbrev-ref HEAD

    # Monitor disk usage during build
    - name: Monitor disk space
      run: |
        echo "Disk space before build:"
        df -h
        echo "Docker images before build:"
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

    - name: Run Script
      env:
        GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
        GITHUB_JOB_NAME: ${{ github.job }}
      run: |
        # Run the build script
        ./bin/first-build.sh

        # Clean up intermediate images after build
        echo "Cleaning up intermediate Docker artifacts..."
        docker image prune -f

        # Wait for services
        until curl --silent -I -f --fail http://localhost:3333 ; do printf .; sleep 1; done
        sleep 240

        # Health checks
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3200)!= "200" )); then exit 1; fi;
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100)!= "200" )); then exit 1; fi;
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ping)!= "200" )); then exit 1; fi;
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3333)!= "200" )); then exit 1; fi;
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)!= "200" )); then exit 1; fi;

        # Generate output for comparison
        docker ps --format '{{.Image}}' | sort >> docker_up_output.txt
        diff <(grep -v 'moby/buildkit:buildx-stable-1' docker_up_output.txt) test/image_names.txt

    # Monitor final disk usage
    - name: Final disk usage check
      if: always()
      run: |
        echo "Final disk space usage:"
        df -h
        echo "Docker images after tests:"
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

    - name: Comprehensive Docker Cleanup
      if: always()
      run: |
        echo "Running comprehensive cleanup..."

        # First, try to kill containers that are restarting or stuck
        echo "Killing any stuck or restarting containers..."
        docker ps -a --format '{{.ID}} {{.Status}}' | grep -E "(Restarting|Up.*restart)" | awk '{print $1}' | xargs -r docker kill || true

        # Wait a moment for containers to die
        sleep 2

        # Force stop all running containers with timeout
        echo "Force stopping all containers..."
        if [ "$(docker ps -q)" ]; then
            timeout 30 docker stop $(docker ps -q) || docker kill $(docker ps -q) || true
        fi

        # Remove all containers (running and stopped)
        echo "Removing all containers..."
        if [ "$(docker ps -aq)" ]; then
            docker rm -f $(docker ps -aq) || true
        fi

        # Remove all images (including intermediate layers)
        echo "Removing all images..."
        if [ "$(docker images -aq)" ]; then
            docker rmi -f $(docker images -aq) || true
        fi

        # Remove all volumes
        echo "Removing all volumes..."
        if [ "$(docker volume ls -q)" ]; then
            docker volume rm -f $(docker volume ls -q) || true
        fi

        # Remove all networks (except default ones)
        echo "Removing custom networks..."
        docker network ls --filter type=custom -q | xargs -r docker network rm || true

        # Clean build cache and system
        echo "Cleaning build cache and system..."
        docker builder prune -af || true
        docker system prune -af --volumes || true

        # If Docker daemon is having issues, restart it (for self-hosted runners)
        if command -v systemctl &> /dev/null; then
            echo "Attempting to restart Docker daemon..."
            sudo systemctl restart docker || true
            sleep 5
            docker system prune -af --volumes || true
        fi

        # Final disk space check
        echo "Disk space after complete cleanup:"
        df -h

        echo "Remaining Docker resources:"
        docker ps -a || true
        docker images || true
        docker volume ls || true

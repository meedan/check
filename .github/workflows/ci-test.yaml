name: Build and Run Check Tests

on:
  push:
    branches:
    - master
    - develop

  pull_request:
    branches:
    - develop

permissions:
  id-token: write   
  contents: read

jobs:
  check-script:
    runs-on: 
        labels: check
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_OIDC_ROLE_TO_ASSUME }}
        aws-region: eu-west-1

    # Clean up disk space before starting
    - name: Free up disk space
      run: |
        echo "Available disk space before cleanup:"
        df -h

        # Remove unnecessary packages and files
        sudo apt-get autoremove -y
        sudo apt-get autoclean -y
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

        # Clean Docker system
        docker system prune -af --volumes || true

        echo "Available disk space after cleanup:"
        df -h

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        # Enable garbage collection and use smaller build cache
        buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage 1000mb

    - name: Before script
      env:
        GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
        GITHUB_JOB_NAME: ${{ github.job }}
      run: |
        sed -i 's/git@github.com:/https:\/\/github.com\//' .gitmodules
        git submodule update --init --recursive
        sed -i '/git submodule/d' bin/first-build.sh
        sed -i 's/--abort-on-container-exit/-d/' bin/first-build.sh
        TAB=$'\t'
        export FALLBACK_BRANCH=$([ "$GITHUB_BRANCH" == "master" ] && echo "main" && echo "master" || echo "develop")
        git submodule foreach 'bash -c "git checkout master ; git checkout develop ; git checkout $FALLBACK_BRANCH ; git checkout $GITHUB_BRANCH ; exit 0"'
        git submodule foreach git rev-parse --abbrev-ref HEAD 

    # Monitor disk usage during build
    - name: Monitor disk space
      run: |
        echo "Disk space before build:"
        df -h
        echo "Docker images before build:"
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

    - name: Run Script
      env:
        GITHUB_BRANCH: ${{ github.head_ref || github.ref_name }}
        GITHUB_JOB_NAME: ${{ github.job }}
      run: |
        # Run the build script
        ./bin/first-build.sh

        # Clean up intermediate images after build
        echo "Cleaning up intermediate Docker artifacts..."
        docker image prune -f

        # Wait for services
        until curl --silent -I -f --fail http://localhost:3333 ; do printf .; sleep 1; done
        sleep 240

        # Health checks
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3200)!= "200" )); then exit 1; fi; 
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100)!= "200" )); then exit 1; fi; 
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ping)!= "200" )); then exit 1; fi;
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3333)!= "200" )); then exit 1; fi;
        if (( $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)!= "200" )); then exit 1; fi; 

        # Generate output for comparison
        docker ps --format '{{.Image}}' | sort >> docker_up_output.txt
        diff <(grep -v 'moby/buildkit:buildx-stable-1' docker_up_output.txt) test/image_names.txt

    # Monitor final disk usage
    - name: Final disk usage check
      if: always()
      run: |
        echo "Final disk space usage:"
        df -h
        echo "Docker images after tests:"
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

    - name: Comprehensive Docker Cleanup
      if: always()
      run: |
        echo "Running comprehensive cleanup..."

        # Stop all running containers
        docker stop $(docker ps -q) || true

        # Remove all containers (running and stopped)
        docker rm $(docker ps -aq) || true

        # Remove all images (including intermediate layers)
        docker rmi $(docker images -aq) || true

        # Remove all volumes
        docker volume rm $(docker volume ls -q) || true

        # Remove all networks (except default ones)
        docker network rm $(docker network ls --filter type=custom -q) || true

        # Clean build cache and system
        docker builder prune -af || true
        docker system prune -af --volumes || true

        # Final disk space check
        echo "Disk space after complete cleanup:"
        df -h

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "pender_metrics"
          scrape_interval: 15s
          static_configs:
            - targets: ["${env:pender_metrics_endpoint}"]
          metrics_path: /metrics

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    timeout: 200ms
    send_batch_size: 8192

exporters:
  otlp/pender_metrics:
    endpoint: "api.honeycomb.io:443" # US instance
    #endpoint: "api.eu1.honeycomb.io:443" # EU instance
    headers:
      "x-honeycomb-team": ${env:x_honeycomb_team} # Honeycomb API KEY
      "x-honeycomb-dataset": "pender"
  # for debugging purposes only
  # debug:
  #   verbosity: normal

connectors:
  routing:
    default_pipelines: []
    # for debugging purposes only
    # default_pipelines: [metrics/debug]
    table:
      - context: resource
        condition: attributes["service.name"] == "pender_metrics"
        pipelines: [metrics/pender_honeycomb]

service:
  # telemetry:
  #   logs:
  #     level: "debug"
  pipelines:
    metrics/prometheus:
      receivers: [prometheus]
      exporters: [routing]
    metrics/pender_honeycomb:
      receivers: [routing]
      processors: [memory_limiter, batch]
      exporters: [otlp/pender_metrics]
    # for debugging purposes only
    # metrics/debug:
    #   receivers: [routing]
    #   exporters: [debug]
